<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#F4FBFA"/>
      <stop offset="50%" stop-color="#D6F4ED"/>
      <stop offset="100%" stop-color="#A7E5D5"/>
    </linearGradient>
    
    <radialGradient id="halo" cx="75%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    
    <symbol id="paw" viewBox="0 0 100 100">
      <path d="M50,82 C35,82 28,72 28,62 C28,52 35,46 45,46 C47.5,46 49.5,47 50,48.5 C50.5,47 52.5,46 55,46 C65,46 72,52 72,62 C72,72 65,82 50,82 Z"/>
      <ellipse cx="30" cy="35" rx="6" ry="9" transform="rotate(-20 30 35)"/>
      <ellipse cx="43" cy="25" rx="6" ry="10"/>
      <ellipse cx="57" cy="25" rx="6" ry="10"/>
      <ellipse cx="70" cy="35" rx="6" ry="9" transform="rotate(20 70 35)"/>
    </symbol>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  
  <!-- Flowing decorative curves -->
  <g fill="none" stroke="#78D1C2" stroke-width="1.5" stroke-linecap="round" opacity="0.22">
    <path d="M-50,420 Q400,320 800,420 T1700,420"/>
    <path d="M-50,580 Q400,480 800,580 T1700,580"/>
  </g>
  
  <!-- Paw prints showing range from small to large animals -->
  <g fill="#5BC0AE">
    <!-- Tiny (kitten/puppy) -->
    <use href="#paw" x="900" y="180" width="55" height="55" opacity="0.45"/>
    <use href="#paw" x="1380" y="200" width="60" height="60" opacity="0.30" transform="rotate(25 1410 230)"/>
    
    <!-- Small (cat/small dog) -->
    <use href="#paw" x="1080" y="250" width="75" height="75" opacity="0.40" transform="rotate(-15 1117 287)"/>
    <use href="#paw" x="850" y="380" width="90" height="90" opacity="0.50" transform="rotate(20 895 425)"/>
    
    <!-- Medium (large dog) -->
    <use href="#paw" x="1180" y="380" width="115" height="115" opacity="0.42"/>
    <use href="#paw" x="1010" y="540" width="135" height="135" opacity="0.55" transform="rotate(10 1077 607)"/>
    
    <!-- Large (horse / camel) -->
    <use href="#paw" x="1300" y="490" width="180" height="180" opacity="0.48" transform="rotate(-12 1390 580)"/>
  </g>
  
  <!-- Sparkles for refresh atmosphere -->
  <g fill="#FFFFFF">
    <circle cx="180" cy="160" r="3.5" opacity="0.9"/>
    <circle cx="320" cy="280" r="2" opacity="0.7"/>
    <circle cx="480" cy="210" r="3" opacity="0.85"/>
    <circle cx="610" cy="360" r="2.5" opacity="0.6"/>
    <circle cx="280" cy="470" r="2" opacity="0.7"/>
    <circle cx="520" cy="620" r="3" opacity="0.8"/>
    <circle cx="700" cy="500" r="2.5" opacity="0.6"/>
    <circle cx="1450" cy="120" r="3" opacity="0.85"/>
    <circle cx="780" cy="780" r="2" opacity="0.5"/>
  </g>
</svg>
